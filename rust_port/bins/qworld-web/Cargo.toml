[package]
name = "qworld-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qworld-engine = { workspace = true }
qworld-fs = { workspace = true }
qworld-bsp = { workspace = true }
qworld-demo = { workspace = true }
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
# web-sys feature list is binary-specific (only this crate touches DOM
# APIs), so the features are extended here rather than in the workspace
# dep.
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Performance",
] }
tracing = { workspace = true }
tracing-wasm = { workspace = true }

[lints]
workspace = true
