[workspace]
resolver = "2"
members = [
    "crates/qworld-core",
    "crates/qworld-fs",
    "crates/qworld-bsp",
    "crates/qworld-mdl",
    "crates/qworld-image",
    "crates/qworld-wav",
    "crates/qworld-shader",
    "crates/qworld-demo",
    "crates/qworld-net",
    "crates/qworld-render",
    "crates/qworld-server",
    "crates/qworld-engine",
    "bins/qworld-cli",
    "bins/qworld-web",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/fte-team/fteqw"

# All third-party dependencies are pinned here and referenced by member
# crates via `{ workspace = true }` for consistency. Keep feature lists
# minimal — only enable what we actually use.
[workspace.dependencies]
# Internal crates
qworld-core = { path = "crates/qworld-core" }
qworld-fs = { path = "crates/qworld-fs" }
qworld-bsp = { path = "crates/qworld-bsp" }
qworld-mdl = { path = "crates/qworld-mdl" }
qworld-image = { path = "crates/qworld-image" }
qworld-wav = { path = "crates/qworld-wav" }
qworld-shader = { path = "crates/qworld-shader" }
qworld-demo = { path = "crates/qworld-demo" }
qworld-net = { path = "crates/qworld-net" }
qworld-render = { path = "crates/qworld-render" }
qworld-server = { path = "crates/qworld-server" }
qworld-engine = { path = "crates/qworld-engine" }

# Errors / logging — used by most crates
thiserror = "2"
tracing = "0.1"

# Math + binary parsing
glam = "0.27"
byteorder = "1"
binrw = "0.14"
bytemuck = { version = "1", features = ["derive"] }

# Filesystem / archives
zip = { version = "2", default-features = false, features = ["deflate"] }

# Image formats — only the ones the renderer consumes
image = { version = "0.25", default-features = false, features = ["png", "tga", "jpeg"] }
pcx = "0.2"

# Audio
hound = "3"

# Renderer — base wgpu features. Backend features (webgl) are added
# per target in the qworld-render crate.
wgpu = { version = "22", default-features = false, features = ["wgsl"] }
futures-intrusive = "0.5"
pollster = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = "0.3"

# Web (wasm)
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

# Dev only
tempfile = "3"

[workspace.lints.clippy]
# Enable pedantic group, then allow the noisier stylistic lints.
pedantic = { level = "warn", priority = -1 }

# Stylistic — not bugs, allow.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"

# Sign/cast lints fire on safe conversions everywhere; we audit casts
# by hand. Allow the noisier ones since Quake-derived code deals with
# small bounded sizes (file lump lengths, byte counts) where 32->64
# bit conversions can't truncate in practice.
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"

# Tests intentionally use exact float equality on known constants.
float_cmp = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
